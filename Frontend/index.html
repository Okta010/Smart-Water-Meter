
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Pelanggan | Smart Water Meter</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page" data-page="login">
    <main class="login-card">
        <h1>💧 Smart Water Meter</h1>
        <p class="muted">Monitoring Pemakaian Air PDAM</p>

        <h2>Masuk ke Akun Pelanggan</h2>

        <form id="loginForm">
            <label class="field" for="identifier">
                ID Pelanggan
                <input
                    id="identifier"
                    name="identifier"
                    type="text"
                    required
                    placeholder="Contoh: PLG001"
                    autocomplete="username"
                >
            </label>

            <label class="field" for="password">
                Password
                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                >
            </label>

            <button class="btn" type="submit" style="width: 100%;">
                Masuk
            </button>
        </form>

        <p id="error" role="alert" aria-live="polite"></p>

        <p class="foot">
            Belum memiliki akun pelanggan?
            <a class="auth-link" href="register.html">Daftar di sini</a>
        </p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
